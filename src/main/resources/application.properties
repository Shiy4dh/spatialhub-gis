spring.application.name=SpatialHub

# Server Port (Cloud platforms assign dynamic port via PORT env var)
server.port=${PORT:8080}

# Database Connection
# If SPRING_DATASOURCE_* env vars are present (e.g. Render/Cloud), they are used.
# Otherwise, it falls back to your local MySQL (spatialhub_db with password 'zydx').
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spatialhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zydx}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect