<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpatialHub | Operator Portal</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 36px 32px;
            width: 360px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }
        h2 { margin: 0 0 6px 0; font-size: 20px; color: #38bdf8; }
        p { margin: 0 0 24px 0; font-size: 13px; color: #94a3b8; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; margin-bottom: 6px; color: #cbd5e1; font-weight: 500; }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn-login {
            width: 100%;
            padding: 11px;
            background: #0284c7;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #0369a1; }
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }
        .demo-creds {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #334155;
            font-size: 11px;
            color: #64748b;
            line-height: 1.6;
        }
        code { color: #38bdf8; background: #0f172a; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>SpatialHub Platform</h2>
    <p>Broadband Operations & GIS Access Portal</p>

    <div id="error-alert" class="error-box">Invalid operator username or password.</div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Operator Username</label>
            <input type="text" id="username" required placeholder="Enter username" />
        </div>
        <div class="form-group">
            <label>Security Password</label>
            <input type="password" id="password" required placeholder="Enter password" />
        </div>
        <button type="submit" class="btn-login">Authenticate Session</button>
    </form>

    <div class="demo-creds">
        <strong>Demo Accounts:</strong><br>
        Dispatcher (NOC): <code>dispatcher</code> / <code>admin123</code><br>
        Field Tech: <code>technician</code> / <code>tech123</code>
    </div>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const alertBox = document.getElementById('error-alert');

        if (alertBox) alertBox.style.display = 'none';

        fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(res => {
            if (!res.ok) throw new Error("Unauthorized");
            return res.json();
        })
        .then(user => {
            localStorage.setItem('minibiss_user', JSON.stringify(user));
            window.location.href = '/dashboard.html';
        })
        .catch(() => {
            if (alertBox) alertBox.style.display = 'block';
        });
    }
</script>
</body>
</html>
